[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cove-duckdb"
dynamic = ["version"]
description = "Versioned contracts and control metadata for the Cove DuckDB analytics product"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["jsonschema==4.25.1", "PyYAML==6.0.1"]

[project.optional-dependencies]
aws = ["boto3==1.42.89"]

[project.urls]
Repository = "https://github.com/amliuyong/cove-duckdb"

[tool.setuptools.dynamic]
version = {attr = "cove_duckdb._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cove_duckdb.contracts" = ["v1/*.json"]
