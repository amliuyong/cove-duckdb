<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1060" role="img" aria-labelledby="title desc">
<title id="title">Colvenna Isle：AWS 数据接入与分析架构</title>
<desc id="desc">The S3/CloudFront Query Editor retains its key in page memory and forwards authenticated API requests to API Gateway without caching API responses. API Gateway and intake Lambda buffer writes through SQS FIFO. Authorizer and management Lambda functions access the DynamoDB control table through the AWS SDK. Query HTTP requests traverse VPC Link and an internal ALB to an ECS query Service. A separate ECS writer Service consumes SQS without an ALB and persists native DuckDB data in S3. An independent VPC synchronous Lambda uses private port 8082 and waits for the approved writer's native receipt. Receipt-conditioned queries invoke the private Writer Control Lambda for a bounded Native copy; user SQL runs only on the query process's sealed snapshot. A scheduling Lambda invokes versioned Lambda functions or starts independent ECS RunTask compute; their Parquet results are published through the writer.</desc>
