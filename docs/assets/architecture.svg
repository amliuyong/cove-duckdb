<rect x="40" y="860" width="360" height="135" rx="12" fill="#f8fafc" stroke="#dbe5e9"/>
<text x="58" y="888" font-size="15" font-weight="700">入口与控制</text>
<text x="58" y="915" font-size="12" fill="#526a74">• 浏览器 → CloudFront → Gateway</text>
<text x="58" y="938" font-size="12" fill="#526a74">• /v1/* 不缓存 · Bearer 原样转发</text>
<text x="58" y="961" font-size="12" fill="#526a74">• 各 Lambda 使用独立 IAM 权限</text>
<rect x="440" y="860" width="360" height="135" rx="12" fill="#f8fafc" stroke="#dbe5e9"/>
<text x="458" y="888" font-size="15" font-weight="700">服务与任务</text>
<text x="458" y="915" font-size="12" fill="#526a74">• 独立同步 Lambda 经 8082 联系许可写者</text>
<text x="458" y="938" font-size="12" fill="#526a74">• 同步 / FIFO / 导入共享提交序号</text>
<text x="458" y="961" font-size="12" fill="#526a74">• 查询每次使用新进程，只暂存引用的数据集</text>
<rect x="840" y="860" width="360" height="135" rx="12" fill="#f8fafc" stroke="#dbe5e9"/>
<text x="858" y="888" font-size="15" font-weight="700">环境构建与执行</text>
<text x="858" y="915" font-size="12" fill="#526a74">• CodeBuild 解析依赖，固定 ECR 镜像</text>
<text x="858" y="938" font-size="12" fill="#526a74">• 数字 Lambda / ECS revision 独立绑定</text>
<text x="858" y="961" font-size="12" fill="#526a74">• 产物分块导入，由写者发布新版本</text>
