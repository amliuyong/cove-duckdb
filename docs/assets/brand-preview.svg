     role="img" aria-labelledby="colvenna-isle-preview-title colvenna-isle-preview-desc">
  <title id="colvenna-isle-preview-title">Colvenna Isle</title>
  <desc id="colvenna-isle-preview-desc">Light and dark Colvenna Isle wordmarks, with application icons at 96, 64, 32 and 24 pixels.</desc>

  <rect width="960" height="670" fill="#E8F0EE"/>
