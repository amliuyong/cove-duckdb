name: Design feedback
description: Propose a product or engineering design change.
title: "[Design] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the workload or user need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the expected behavior and affected documentation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and constraints
      description: Link primary sources, measurements, or known limitations.
